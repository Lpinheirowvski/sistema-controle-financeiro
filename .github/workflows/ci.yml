name: Quality and MySQL integration

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: ci-only-ephemeral-password
          MYSQL_DATABASE: financial_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: financial_test
          DB_USER: root
          DB_PASSWORD: ci-only-ephemeral-password
          RUN_MYSQL_TESTS: '1'
      - name: Check Compose configuration without printing credentials
        run: |
          python scripts/setup_env.py
          docker compose config --quiet
      - name: Build production image
        run: docker build --target base -t financial-analytics:local .
      - name: Verify startup and runtime database permissions
        run: |
          docker compose up -d --wait db
          docker compose run --rm migrate python -m financial_analytics.cli init --seed
          docker compose run --rm migrate python -m financial_analytics.cli init --seed
          docker compose up -d --wait app
          docker compose exec -T app python -c 'from financial_analytics.repository import TransactionRepository; assert len(TransactionRepository().list()) == 240'
      - name: Stop containers, preserving volumes
        if: always()
        run: docker compose stop
